services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-task-architect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_task_architect}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_task_architect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-task-architect-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: ai-task-architect-api
    restart: unless-stopped
    env_file:
      - path: ./api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_task_architect}
      REDIS_URL: redis://redis:6379
      # Inicialização automática do banco no boot (ver api/docker-entrypoint.sh).
      # Defina como "false" para pular migrations/seed em execuções específicas.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Folga maior: o primeiro boot aplica migrations e roda o seed antes de servir.
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    container_name: ai-task-architect-web
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (não "localhost"): o dev server do Vite faz bind em IPv4 (0.0.0.0)
      # e "localhost" pode resolver para ::1 (IPv6) no Alpine, recusando a conexão.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
